on:
  release:
    types: [published]
name: Deploy to docker hub
jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    - name: Docker Build
      run: docker build -t uwitedm/atlantis:${{ github.event.release.tag_name }} .
    - name: Docker push
      run: docker push uwitedm/atlantis:${{ github.event.release.tag_name }}
